# ============================================
# Nginx Configuration untuk produsenkubahmasjid.id
# ============================================
# Letakkan file ini di: /etc/nginx/sites-available/produsenkubahmasjid.id
# Atau minta hosting provider untuk menambahkan config ini

server {
    listen 80;
    listen [::]:80;
    server_name produsenkubahmasjid.id www.produsenkubahmasjid.id;
    
    # Redirect HTTP to HTTPS (jika sudah ada SSL)
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name produsenkubahmasjid.id www.produsenkubahmasjid.id;
    
    # SSL Certificate paths (sesuaikan dengan hosting Anda)
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;
    
    root /home/produsen1/public_html;
    index index.php index.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Disable directory listing
    autoindex off;
    
    # Logging
    access_log /var/log/nginx/produsenkubahmasjid_access.log;
    error_log /var/log/nginx/produsenkubahmasjid_error.log;
    
    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM Configuration
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock; # Sesuaikan versi PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Deny access to sensitive files
    location ~ /(application|system|migrations|\.git) {
        deny all;
        return 404;
    }
}
